# Pippa Agent & Web - Production Compose
#
# Build and run:
#   docker-compose up -d --build
#
# Requires:
#   - Environment variables set on host
#   - External services (Redis, PostgreSQL, Neo4j, Qdrant)

services:
  pippa-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-api
      secrets:
        - npmrc
    container_name: pippa-agent-api
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${AGENT_API_PORT}:${AGENT_API_PORT}"
    volumes:
      - ./spiffe-bundle.pem:/spiffe-bundle.pem:ro
    environment:
      - NODE_EXTRA_CA_CERTS=/spiffe-bundle.pem

      # Application
      - AGENT_API_PORT=${AGENT_API_PORT}
      - NODE_ENV=production
      - PORT=${AGENT_API_PORT}
      - LOG_LEVEL=debug
      - USE_STUBS=false

      # AI Providers
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY

      # Authentication (disable for local dev)
      - DISABLE_AUTH
      - ZITADEL_ISSUER=https://auth.rso
      - ZITADEL_AUDIENCE=352079658088464386
      - ZITADEL_PROJECT_ID=352079615960809474
      - ZITADEL_CLIENT_ID=352079658088464386

      # Memory config
      - MEMORY_CONTEXT_MODE
      - MEMORY_TOOL_ACCESS

      # L1: Redis (on bad-bitch-net)
      - REDIS_URL=redis://redis:6379

      # L2: PostgreSQL (on bad-bitch-net)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pippa

      # L3: Neo4j (on bad-bitch-net)
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER
      - NEO4J_PASSWORD
      - NEO4J_DATABASE
      - NEO4J_DATABASE_PER_USER

      # L4: Qdrant (on bad-bitch-net)
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY

      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SERVICE_NAME

      # Crisis Response
      - CRISIS_ALERT_WEBHOOK_URL
      - CRISIS_THRESHOLD_HIGH
      - CRISIS_THRESHOLD_CRITICAL

      # RecoverySky API
      - MEETING_API_URL
      - MEETING_API_TOKEN
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:${PORT}/health",
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 10s
    #   retries: 3

  pippa-web-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-api
      secrets:
        - npmrc
    container_name: pippa-web-api
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${WEB_API_PORT}:${WEB_API_PORT}"
    environment:
      - WEB_API_PORT=${WEB_API_PORT}
      - NODE_ENV=production
      - LOG_LEVEL=debug
      - PORT=${WEB_API_PORT}

      # L2: PostgreSQL (on bad-bitch-net)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pippa

      # LLM Provider
      - GROQ_API_KEY

  pippa-web-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-app
      args:
        AGENT_API_PORT: ${AGENT_API_PORT}
      secrets:
        - npmrc
    container_name: pippa-web-app
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${WEB_APP_PORT}:80"
    environment:
      - AGENT_API_PORT=${AGENT_API_PORT}
      - WEB_APP_PORT=${WEB_APP_PORT}
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:80/",
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 5s
    #   retries: 3

networks:
  recoverysky:
    external: true

secrets:
  npmrc:
    file: ${HOME}/.npmrc
