# Pippa Agent & Web - Production Compose
#
# Build and run:
#   docker-compose up -d --build
#
# Requires:
#   - Environment variables set on host
#   - External services (Redis, PostgreSQL, Neo4j, Qdrant)

services:
  pippa-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
      secrets:
        - npmrc
    container_name: pippa-agent
    restart: unless-stopped
    networks:
      - bad-bitch-net
    ports:
      - "61664:3000"
    volumes:
      - ./spiffe-bundle.pem:/spiffe-bundle.pem:ro
    environment:
      - NODE_EXTRA_CA_CERTS=/spiffe-bundle.pem

      # Application
      - NODE_ENV
      - PORT
      - LOG_LEVEL
      - USE_STUBS

      # AI Providers
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY

      # Authentication
      - ZITADEL_ISSUER
      - ZITADEL_AUDIENCE

      # Memory config
      - MEMORY_CONTEXT_MODE
      - MEMORY_TOOL_ACCESS

      # L1: Redis
      - REDIS_URL
      # - REDIS_USERNAME=pippa
      # - REDIS_PASSWORD=${REDIS_AGENT_PASSWORD}

      # L2: PostgreSQL
      - DATABASE_URL

      # L3: Neo4j
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASSWORD
      - NEO4J_DATABASE
      - NEO4J_DATABASE_PER_USER

      # L4: Qdrant
      - QDRANT_URL
      - QDRANT_API_KEY

      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SERVICE_NAME

      # Crisis Response
      - CRISIS_ALERT_WEBHOOK_URL
      - CRISIS_THRESHOLD_HIGH
      - CRISIS_THRESHOLD_CRITICAL

      # RecoverySky API
      - MEETING_API_URL
      - MEETING_API_TOKEN
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:${PORT}/health",
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 10s
    #   retries: 3

  pippa-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      secrets:
        - npmrc
    container_name: pippa-web
    restart: unless-stopped
    networks:
      - bad-bitch-net
    ports:
      - "61665:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

networks:
  bad-bitch-net:
    external: true

secrets:
  npmrc:
    file: ${HOME}/.npmrc
