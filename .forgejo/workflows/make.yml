name: Build & Push Docker Images to AWS ECR

on:
  push:
    branches:
      - cmd

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

env:
  ENV: "cmd"
  AWS_REGION: us-east-2

jobs:
  upload-opt:
    runs-on: hestia
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Upload opt/ to rsync.net
        run: |
          set -euxo pipefail

          # Start ssh-agent and load key
          eval $(ssh-agent -s)
          echo "${{ secrets.RSYNC_SSH_PRIVATE_KEY }}" | ssh-add -
          ssh-add -l

          # Setup known_hosts
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan ${{ secrets.RSYNC_HOST }} >> ~/.ssh/known_hosts

          # Rsync upload
          rsync -avz --times \
            --exclude='._*' \
            --exclude='.DS_Store' \
            --exclude='__MACOSX' \
            --mkpath \
            opt/ \
            ${{ secrets.RSYNC_USER }}@${{ secrets.RSYNC_HOST }}:recoverysky/containers/${{ env.ENV }}/${{ github.event.repository.name }}/

          # Cleanup
          eval $(ssh-agent -k)

  docker-build-and-push:
    runs-on: hestia
    strategy:
      matrix:
        include:
          - image: pippa-agent
            target: agent-api
            build-args: ""
          - image: pippa-api
            target: web-api
            build-args: ""
          - image: pippa-app
            target: web-app
            build-args: "AGENT_API_PORT=61664"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for build relevant file changes
        id: build_filter
        uses: ./.forgejo/actions/check-build-changes
        with:
          before-ref: ${{ github.event.before }}
          current-sha: ${{ github.sha }}

      - name: Create .npmrc in project directory
        if: steps.build_filter.outputs.build_required == 'true'
        run: |
          cat > .npmrc << 'EOF'
          strict-ssl=false
          //git.rso/api/packages/trex/npm/:_authToken=${{ secrets.FORGEJO_AUTH_TOKEN }}
          //git.rso/api/packages/jenova-marie/npm/:_authToken=${{ secrets.FORGEJO_AUTH_TOKEN }}
          //git.rso/api/packages/recoverysky-org/npm/:_authToken=${{ secrets.FORGEJO_AUTH_TOKEN }}
          @dt70s:registry=https://git.rso/api/packages/dt70s/npm/
          @recoverysky-org:registry=https://git.rso/api/packages/recoverysky-org/npm/
          @jenova-marie:registry=https://git.rso/api/packages/jenova-marie/npm/
          @trex-ts:registry=https://git.rso/api/packages/trex/npm/
          EOF
          sed -i 's/^[[:space:]]*//' .npmrc
          echo "=== Generated .npmrc ==="
          cat .npmrc

      - name: Configure AWS Credentials via OIDC
        if: steps.build_filter.outputs.build_required == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        if: steps.build_filter.outputs.build_required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        if: steps.build_filter.outputs.build_required == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata (${{ matrix.image }})
        if: steps.build_filter.outputs.build_required == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AWS_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.ENV }}
            type=raw,value=latest

      - name: Build and Push ${{ matrix.image }} image
        if: steps.build_filter.outputs.build_required == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=registry,ref=${{ secrets.AWS_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.image }}:cache
          cache-to: type=registry,ref=${{ secrets.AWS_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.image }}:cache,mode=max
          secret-files: |
            npmrc=./.npmrc

      - name: Trigger deployment (${{ matrix.image }})
        if: steps.build_filter.outputs.build_required == 'true'
        uses: ./.forgejo/actions/webhook
        with:
          webhook_url: https://webhook.rso/webhooks
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          streams: eda
          type: deploy
          action: deploy_container
          service: ${{ matrix.image }}
          instance: inanna
          zone: ${{ env.AWS_REGION }}
          environment: ${{ env.ENV }}

      - name: Notify build failure
        if: failure()
        uses: ./.forgejo/actions/webhook
        with:
          webhook_url: https://webhook.rso/webhooks
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          streams: ci
          type: build
          action: failure
          service: ${{ matrix.image }}
          instance: inanna
          environment: ${{ env.ENV }}
