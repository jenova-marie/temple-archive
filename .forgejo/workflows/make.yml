name: Build & Push Docker Image to AWS ECR
on:
  push:
    branches-ignore:
      - root
  workflow_dispatch: # Allows manual triggering
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read
env:
  STACK: "agents"
jobs:
  docker-build-and-push:
    runs-on: builder
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Need full history to find branch

      - uses: ./.forgejo/actions/check-build-changes
        id: changes
        with:
          before-ref: ${{ github.event.before }}
          current-sha: ${{ github.sha }}

      - uses: ./.forgejo/actions/detect-aws-env
        id: aws-env

      - uses: ./.forgejo/actions/rsync-opt
        with:
          ssh-private-key: ${{ secrets.RSYNC_SSH_PRIVATE_KEY }}
          rsync-host: ${{ secrets.RSYNC_HOST }}
          rsync-user: ${{ secrets.RSYNC_USER }}
          env: ${{ steps.aws-env.outputs.env }}
          repo-name: ${{ github.event.repository.name }}

      - name: Create .npmrc for Docker build
        if: steps.changes.outputs.build_required == 'true'
        run: |
          cat > ${{ github.workspace }}/.npmrc << 'EOF'
          strict-ssl=false
          //git.rso/api/packages/trex/npm/:_authToken=${{ secrets.FORGEJO_AUTH_TOKEN }}
          //git.rso/api/packages/jenova-marie/npm/:_authToken=${{ secrets.FORGEJO_AUTH_TOKEN }}
          //git.rso/api/packages/recoverysky-org/npm/:_authToken=${{ secrets.FORGEJO_AUTH_TOKEN }}
          @dt70s:registry=http://git.rso/api/packages/dt70s/npm/
          @recoverysky-org:registry=http://git.rso/api/packages/recoverysky-org/npm/
          @jenova-marie:registry=http://git.rso/api/packages/jenova-marie/npm/
          @trex-ts:registry=http://git.rso/api/packages/trex/npm/
          EOF

      # Multi-stage Dockerfile produces three distinct images. Build each
      # stage separately, push to its own ECR repo. Cache is target-scoped
      # so the three builds don't fight over the same cache key.

      - name: Build & Push agent-api (Node :61664)
        if: steps.changes.outputs.build_required == 'true'
        uses: ./.forgejo/actions/build-docker
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.aws-env.outputs.aws-region }}
          aws-account-id: ${{ secrets.AWS_ID }}
          image-name: siri-agent-api
          image-tag: ${{ steps.aws-env.outputs.env }}
          latest: "true"
          target: agent-api

      - name: Build & Push web-api (Node :61665)
        if: steps.changes.outputs.build_required == 'true'
        uses: ./.forgejo/actions/build-docker
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.aws-env.outputs.aws-region }}
          aws-account-id: ${{ secrets.AWS_ID }}
          image-name: siri-web-api
          image-tag: ${{ steps.aws-env.outputs.env }}
          latest: "true"
          target: web-api

      - name: Build & Push web-app (nginx :80, SPA)
        if: steps.changes.outputs.build_required == 'true'
        uses: ./.forgejo/actions/build-docker
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.aws-env.outputs.aws-region }}
          aws-account-id: ${{ secrets.AWS_ID }}
          image-name: siri-web-app
          image-tag: ${{ steps.aws-env.outputs.env }}
          latest: "true"
          target: web-app
          # AGENT_API_PORT is consumed by the web-app-builder stage and
          # baked into the Vite bundle (see Dockerfile lines 73-74). The
          # SPA's runtime fetches anonymous-chat at :61664 directly.
          build-args: |
            AGENT_API_PORT=61664

      - name: Deploy to swarm
        run: |
          set -euxo pipefail

          eval $(ssh-agent -s)
          echo "${{ secrets.RUNNER_SSH_PRIVATE_KEY }}" | base64 -d | ssh-add -

          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              ec2-user@klotho.prod.rso \
              "swarm restart ${{ env.STACK }} siri-agent-api && \
               swarm restart ${{ env.STACK }} siri-web-api && \
               swarm restart ${{ env.STACK }} siri-web-app"

          eval $(ssh-agent -k)

      - name: Notify build failure
        if: failure()
        uses: ./.forgejo/actions/webhook
        with:
          webhook_url: https://webhook.rso/webhooks
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          streams: ci
          type: build
          action: failure
          service: ${{ github.event.repository.name }}
          environment: ${{ steps.aws-env.outputs.env }}
          instance: ${{ env.INSTANCE }}
