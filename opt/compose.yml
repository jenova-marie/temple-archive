# RecoverySky Agent - Production Compose
#
# Build (requires BuildKit secret for private registry):
#   DOCKER_BUILDKIT=1 docker build --secret id=npmrc,src=$HOME/.npmrc -t recoverysky-agent ..
#
# Run:
#   docker-compose -f opt/compose.yml up -d
#
# Requires:
#   - Pre-built image (see build command above)
#   - Environment variables set on host
#   - External services (Redis, PostgreSQL, Neo4j, Qdrant)

services:
  agent:
    image: ${DOCKER_IMAGE}
    container_name: recoverysky-agent
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Application
      - NODE_ENV
      - PORT
      - LOG_LEVEL
      - USE_STUBS

      # AI Providers
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY

      # Authentication
      - ZITADEL_ISSUER
      - ZITADEL_AUDIENCE

      # Memory config
      - MEMORY_CONTEXT_MODE
      - MEMORY_TOOL_ACCESS

      # L1: Redis
      - REDIS_URL

      # L2: PostgreSQL
      - DATABASE_URL

      # L3: Neo4j
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASSWORD

      # L4: Qdrant
      - QDRANT_URL
      - QDRANT_API_KEY

      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SERVICE_NAME

      # Crisis Response
      - CRISIS_ALERT_WEBHOOK_URL
      - CRISIS_THRESHOLD_HIGH
      - CRISIS_THRESHOLD_CRITICAL

      # RecoverySky API
      - MEETING_API_URL
      - MEETING_API_TOKEN
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    # Docker resource constraints
    deploy:
      resources:
        limits:
          cpus: ${DOCKER_CPUS_LIMIT}
          memory: ${DOCKER_MEMORY_LIMIT}
        reservations:
          cpus: ${DOCKER_CPUS_RESERVATION}
          memory: ${DOCKER_MEMORY_RESERVATION}
