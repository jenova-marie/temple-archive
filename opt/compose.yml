# Siri Agent & Web - Production Compose
#
# Build and run:
#   docker-compose up -d --build
#
# Requires:
#   - Environment variables set on host
#   - External services (Redis, PostgreSQL, Neo4j, Qdrant)

services:
  siri-agent-api:
    image: ${DOCKER_AGENT_IMAGE}
    container_name: siri-agent
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${AGENT_API_PORT}:${AGENT_API_PORT}"
    volumes:
      - /opt/containers/siri:/container:ro
      - /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/container/ca-bundle.crt:ro
    environment:
      - NODE_EXTRA_CA_CERTS=/container/ca-bundle.crt
      - HOME=/tmp

      # Application
      - PORT=${AGENT_API_PORT}
      - AGENT_API_PORT
      - NODE_ENV=production
      - LOG_LEVEL=debug
      - USE_STUBS=false

      # AI Providers
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY

      # Authentication (disable for local dev)
      - DISABLE_AUTH
      - AUTH0_ISSUER_BASE_URL
      - AUTH0_AUDIENCE
      - AUTH0_CLIENT_ID

      # Memory config
      - MEMORY_CONTEXT_MODE
      - MEMORY_TOOL_ACCESS

      # L1: Redis (on bad-bitch-net)
      - REDIS_URL=${REDIS_URL}

      # L2: PostgreSQL (on bad-bitch-net)
      - DATABASE_URL

      # L3: Neo4j (on bad-bitch-net)
      - NEO4J_URI=neo4j://neo4j.rso:7687
      - NEO4J_USER
      - NEO4J_PASSWORD
      - NEO4J_DATABASE
      - NEO4J_DATABASE_PER_USER

      # L4: Qdrant (on bad-bitch-net)
      - QDRANT_URL=http://qdrant.rso
      - QDRANT_API_KEY
      - QDRANT_COLLECTION_NAME
      - QDRANT_SEARCH_MODE

      # L5: Mem0 (primary memory when enabled)
      - ENABLE_L5_MEMORY
      - MEM0_API_URL
      - L5_MEMORY_LIMIT

      # Memory tier feature flags
      - ENABLE_L2_RETRIEVAL
      - ENABLE_L3_QUERIES
      - ENABLE_ENTITY_EXTRACTION
      - ENABLE_PREFLIGHT_EMBEDDINGS
      - ENABLE_POSTFLIGHT_EMBEDDINGS
      - EMBEDDING_BATCH_ENABLED
      - USE_L3_EXTRACTION
      - USE_L3_RETRIEVAL

      # Memory tools and prompts
      - ENABLE_TOOLS
      - MEMORY_PROMPT_ENABLED
      - MEMORY_PROMPT_RECENT_MESSAGES
      - MEMORY_PROMPT_MAX_TTL_MINUTES
      - MEMORY_REFLECTOR_ENABLED

      # Query preprocessing
      - QUERY_PREPROCESSING_MODE
      - QUERY_PREPROCESSING_THRESHOLD

      # Entity extraction config
      - ENTITY_EXTRACTION_MODEL
      - ENTITY_EXTRACTION_TYPES
      - ENTITY_MIN_IMPORTANCE
      - ENTITY_INFER_RELATIONSHIPS

      # Context compaction
      - COMPACTION_ENABLED
      - COMPACTION_THRESHOLD
      - COMPACTION_BATCH_SIZE
      - COMPACTION_MODEL
      - COMPACTION_MAX_TOKENS
      - COMPACTION_TIMEOUT_MS

      # Safety and evaluation
      - ENABLE_CRISIS_DETECTION
      - ENABLE_DEEP_CRISIS_EVAL
      - ENABLE_SAFETY_VALIDATION
      - ENABLE_RESPONSE_EVALUATION

      # Runtime config
      - HOT_CONFIG
      - AGENT_MODEL

      # MCP (Model Context Protocol) servers
      - ENABLE_MCP=true
      - MCP_CONFIG_PATH=/container/mcp.json

      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SERVICE_NAME

      # Crisis Response
      - CRISIS_ALERT_WEBHOOK_URL
      - CRISIS_THRESHOLD_HIGH
      - CRISIS_THRESHOLD_CRITICAL

      # RecoverySky API
      - MEETING_API_URL
      - MEETING_API_TOKEN
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:${PORT}/health",
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 10s
    #   retries: 3

  siri-web-api:
    image: ${DOCKER_API_IMAGE}
    container_name: siri-api
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${WEB_API_PORT}:${WEB_API_PORT}"
    environment:
      - WEB_API_PORT=${WEB_API_PORT}
      - NODE_ENV=production
      - LOG_LEVEL=debug
      - PORT=${WEB_API_PORT}

      # L2: PostgreSQL (on bad-bitch-net)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/siri

      # LLM Provider
      - GROQ_API_KEY

  siri-web-app:
    image: ${DOCKER_APP_IMAGE}
    container_name: siri-app
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${WEB_APP_PORT}:80"
    environment:
      - AGENT_API_PORT=${AGENT_API_PORT}
      - WEB_APP_PORT=${WEB_APP_PORT}
    # healthcheck:
    #   test:
    #     [
    #       "CMD",
    #       "wget",
    #       "--no-verbose",
    #       "--tries=1",
    #       "--spider",
    #       "http://localhost:80/",
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   start_period: 5s
    #   retries: 3

networks:
  recoverysky:
    external: true
