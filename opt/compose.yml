# Pippa Agent & Web - Production Compose (opt deployment)
#
# Build and run:
#   docker-compose -f opt/compose.yml up -d --build
#
# Requires:
#   - Environment variables set on host
#   - External services (Redis, PostgreSQL, Neo4j, Qdrant)

services:
  agent:
    build:
      context: ..
      dockerfile: Dockerfile
      target: agent
      secrets:
        - npmrc
    image: ${DOCKER_IMAGE:-pippa-agent:latest}
    container_name: pippa-agent
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Standard container config & pki
      - /opt/containers/caddy:/container:ro
      - /etc/pki/tls/certs/ca-bundle.crt:/container/ca-bundle.crt:ro
    environment:
      - NODE_EXTRA_CA_CERTS=/container/ca-bundle.crt

      # Application
      - NODE_ENV
      - PORT
      - LOG_LEVEL
      - USE_STUBS

      # AI Providers
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY

      # Authentication
      - ZITADEL_ISSUER
      - ZITADEL_AUDIENCE

      # Memory config
      - MEMORY_CONTEXT_MODE
      - MEMORY_TOOL_ACCESS

      # L1: Redis
      - REDIS_URL
      - REDIS_USERNAME=agent-sky
      - REDIS_PASSWORD=${REDIS_AGENT_SKY_PASSWORD}

      # L2: PostgreSQL
      - DATABASE_URL

      # L3: Neo4j
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASSWORD
      - NEO4J_DATABASE
      - NEO4J_DATABASE_PER_USER

      # L4: Qdrant
      - QDRANT_URL
      - QDRANT_API_KEY

      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SERVICE_NAME

      # Crisis Response
      - CRISIS_ALERT_WEBHOOK_URL
      - CRISIS_THRESHOLD_HIGH
      - CRISIS_THRESHOLD_CRITICAL

      # RecoverySky API
      - MEETING_API_URL
      - MEETING_API_TOKEN
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT}/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    # Docker resource constraints
    deploy:
      resources:
        limits:
          cpus: ${DOCKER_CPUS_LIMIT}
          memory: ${DOCKER_MEMORY_LIMIT}
        reservations:
          cpus: ${DOCKER_CPUS_RESERVATION}
          memory: ${DOCKER_MEMORY_RESERVATION}

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      secrets:
        - npmrc
    image: ${DOCKER_WEB_IMAGE:-pippa-web:latest}
    container_name: pippa-web
    restart: unless-stopped
    networks:
      - recoverysky
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/",
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    # Docker resource constraints
    deploy:
      resources:
        limits:
          cpus: ${DOCKER_WEB_CPUS_LIMIT:-0.5}
          memory: ${DOCKER_WEB_MEMORY_LIMIT:-256M}
        reservations:
          cpus: ${DOCKER_WEB_CPUS_RESERVATION:-0.1}
          memory: ${DOCKER_WEB_MEMORY_RESERVATION:-64M}

networks:
  recoverysky:
    external: true

secrets:
  npmrc:
    file: ${HOME}/.npmrc
