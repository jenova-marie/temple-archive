version: "3.8"

# RecoverySky Agent - Local Development Services
# Run: docker-compose up -d

services:
  # L1: Redis (Active Context Cache)
  redis:
    image: redis:7-alpine
    container_name: recoverysky-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # L2: PostgreSQL + pgvector (Session Persistence)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recoverysky-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: recoverysky
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recoverysky"]
      interval: 10s
      timeout: 5s
      retries: 5

  # L3: Neo4j (Knowledge Graph)
  neo4j:
    image: neo4j:5.13-community
    container_name: recoverysky-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # L4: Qdrant (Vector Store)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recoverysky-qdrant
    ports:
      - "6333:6333" # HTTP
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Observability: Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: recoverysky-jaeger
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP
      - "4317:4317" # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: true
    profiles:
      - observability

  # Observability: Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: recoverysky-grafana
    ports:
      - "3333:3333"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
    profiles:
      - observability

  # Observability: Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: recoverysky-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    profiles:
      - observability

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  grafana_data:
  prometheus_data:

networks:
  default:
    name: recoverysky-network
